name: build

# Builds the two ready-to-run distributions and attaches them to the GitHub release:
#   * ClipBlitzStudio-windows.zip  — a PyInstaller EXE folder (no Python needed on the PC)
#   * ClipBlitzStudio.apk          — the Android companion app (thin WebView shell)
# Runs on every push to main and on demand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the packager
        run: pip install pyinstaller

      - name: Fetch ffmpeg + yt-dlp into studio/bin
        working-directory: studio
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-tools.ps1

      - name: Check the brand assets are current
        working-directory: studio
        run: python scripts/make_icons.py --check

      # The release is verified by the same suites a developer runs: engine fidelity,
      # the learning layers, and the agent/MCP surface. Offline and stdlib only.
      - name: Run the offline test suites
        working-directory: studio
        run: |
          python scripts/test_engines.py
          python scripts/test_learning.py
          python scripts/test_agent.py
          python scripts/test_trainer.py
          python scripts/test_rights.py
          python scripts/test_scout.py
          python scripts/test_clipbench.py
          python scripts/test_marketplace.py

      - name: Build the EXE
        working-directory: studio
        run: pyinstaller --noconfirm --clean --name ClipBlitzStudio --onedir --icon assets/ClipBlitzStudio.ico run.py

      - name: Assemble the distribution folder
        shell: pwsh
        run: |
          $target = "studio/dist/ClipBlitzStudio"
          Copy-Item -Recurse -Force studio/web "$target/web"
          Copy-Item -Recurse -Force studio/bin  "$target/bin"
          Copy-Item -Recurse -Force studio/assets "$target/assets"
          # The agent plugin rides along: this folder's EXE answers the same MCP server
          # (ClipBlitzStudio.exe --mcp), so a machine with no Python still has the
          # "hand it a video, get clips back" front door.
          Copy-Item -Recurse -Force studio/plugin "$target/plugin"
          Copy-Item -Force studio/README.md, studio/SETUP.md "$target/"
          # the .ico is also copied next to the EXE so a desktop shortcut and the
          # Start menu entry can borrow the same icon the executable carries.
          Compress-Archive -Path $target -DestinationPath ClipBlitzStudio-4.2.0-windows.zip

      - name: Smoke-test the EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath studio/dist/ClipBlitzStudio/ClipBlitzStudio.exe -ArgumentList '4311' -PassThru
          Start-Sleep -Seconds 12
          $h = Invoke-RestMethod -Uri 'http://127.0.0.1:4311/api/health' -TimeoutSec 30
          if (-not $h.hardware.render_capable) { throw 'bundled ffmpeg not found' }
          Write-Host "health ok: $($h.name) $($h.version) ffmpeg=$($h.ffmpeg)"
          Stop-Process -Id $p.Id -Force

      - name: Smoke-test the agent front door in the EXE
        shell: pwsh
        run: |
          $exe = "studio/dist/ClipBlitzStudio/ClipBlitzStudio.exe"
          $tools = (& $exe --tools | Out-String) | ConvertFrom-Json
          if (-not ($tools | Where-Object { $_.name -eq 'cut_clips' })) {
            throw 'the packaged EXE does not list its agent tools'
          }
          if ($tools.Count -ne 11) {
            throw "the packaged EXE lists $($tools.Count) tools, not 11"
          }
          $ask = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}'
          $reply = ($ask | & $exe --mcp) -join "`n"
          if (-not $reply.Contains('clipblitz-studio')) {
            throw 'the packaged EXE does not answer MCP on stdio'
          }
          if (-not (Test-Path 'studio/dist/ClipBlitzStudio/plugin/.claude-plugin/plugin.json')) {
            throw 'the agent plugin folder is missing from the distribution'
          }
          Write-Host "agent front door ok: $($tools.Count) tools, MCP answers, plugin folder present"

      # Uploading needs the tag to exist. One idempotent step, so a version bump cannot
      # fail late on a release nobody created yet.
      - name: Ensure the release tag exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.2.0 -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v4.2.0 -R $env:GITHUB_REPOSITORY `
              --title "ClipBlitz Studio 4.2.0" `
              --notes "Built from main by the release workflow."
          }

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v4.2.0 ClipBlitzStudio-4.2.0-windows.zip --clobber -R $env:GITHUB_REPOSITORY

      # Everything above tested the folder before it was zipped. This step tests what a
      # user actually downloads: the published asset, unpacked and executed from scratch.
      - name: Verify the published bundle as a user would
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.2.0 --pattern ClipBlitzStudio-4.2.0-windows.zip --dir published --clobber -R $env:GITHUB_REPOSITORY
          $built = (Get-FileHash ClipBlitzStudio-4.2.0-windows.zip -Algorithm SHA256).Hash.ToLower()
          $published = (Get-FileHash published/ClipBlitzStudio-4.2.0-windows.zip -Algorithm SHA256).Hash.ToLower()
          if ($built -ne $published) { throw "the stored asset is not the built one ($published vs $built)" }
          Expand-Archive published/ClipBlitzStudio-4.2.0-windows.zip -DestinationPath published/app
          $root = 'published/app/ClipBlitzStudio'
          if (-not (Test-Path "$root/plugin/.claude-plugin/plugin.json")) { throw 'the published zip lost the plugin folder' }
          if (-not (Test-Path "$root/plugin/.mcp.windows.json")) { throw 'the published zip lost the Windows MCP config' }
          $plugin = @(Get-ChildItem -Recurse -File -Force "$root/plugin").Count
          if ($plugin -ne 9) { throw "the published zip carries $plugin plugin files, not 9" }
          $tools = (& "$root/ClipBlitzStudio.exe" --tools | Out-String) | ConvertFrom-Json
          if (-not ($tools | Where-Object { $_.name -eq 'cut_clips' })) { throw 'the published EXE cannot list its agent tools' }
          if ($tools.Count -ne 11) { throw "the published EXE lists $($tools.Count) tools, not 11" }
          $ask = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}'
          $reply = ($ask | & "$root/ClipBlitzStudio.exe" --mcp) -join "`n"
          if (-not $reply.Contains('clipblitz-studio')) { throw 'the published EXE cannot serve MCP on stdio' }
          Write-Host "published bundle verified: digest matches, 9 plugin files, $($tools.Count) tools, MCP answers"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipBlitzStudio-4.2.0-windows
          path: ClipBlitzStudio-4.2.0-windows.zip

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      BT: ${{ github.workspace }}/bt
    steps:
      - uses: actions/checkout@v4

      - name: Accept SDK licences and install build-tools + platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" >/dev/null

      - name: Build the APK (aapt2 + javac + d8 + apksigner)
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          mkdir -p build/gen build/classes build/dex

          # resources (the launcher icon) + binary manifest
          "$BT/aapt2" compile --dir studio/android/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$JAR" \
            --manifest studio/android/AndroidManifest.xml \
            build/res.zip \
            --java build/gen

          # compile the activity against the platform jar, together with the R
          # aapt2 just generated for the icon it linked in
          javac -source 11 -target 11 -nowarn \
            -classpath "$JAR" -d build/classes \
            $(find studio/android/java build/gen -name '*.java')

          # dex
          "$BT/d8" --release --lib "$JAR" --min-api 24 \
            --output build/dex $(find build/classes -name '*.class')

          # pack the dex into the apk, align, sign with a fresh release key
          cd build && zip -j base.apk dex/classes.dex && cd ..
          "$BT/zipalign" -f 4 build/base.apk build/aligned.apk
          keytool -genkeypair -v -keystore build/studio.keystore -alias clipblitz \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass clipblitz -keypass clipblitz \
            -dname "CN=ClipBlitz Studio, OU=ClipBlitz, O=ClipBlitz, L=Local, ST=Local, C=IN"
          "$BT/apksigner" sign --ks build/studio.keystore \
            --ks-pass pass:clipblitz --key-pass pass:clipblitz \
            --out ClipBlitzStudio.apk build/aligned.apk
          "$BT/apksigner" verify ClipBlitzStudio.apk

      - name: Ensure the release tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v4.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create v4.2.0 --repo "$GITHUB_REPOSITORY" \
              --title "ClipBlitz Studio 4.2.0" \
              --notes "Built from main by the release workflow."

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v4.2.0 ClipBlitzStudio.apk --clobber -R "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipBlitzStudio-apk
          path: ClipBlitzStudio.apk

  # The phone running the studio itself: CPython + the real engine + its own server,
  # inside one APK. Experimental, so it publishes an artifact and never touches the
  # release: the companion APK above stays the shipped one until the milestones in
  # studio/android-standalone/README.md are done.
  standalone:
    name: Android standalone (on-device engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12 (must match the app's Python version)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the SDK platform and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Stage the engine into the app
        working-directory: studio/android-standalone
        run: python sync-python.py

      - name: Smoke-test the staged engine through the Android bootstrap
        working-directory: studio/android-standalone
        run: python smoke.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the on-device APK
        working-directory: studio/android-standalone
        run: gradle --no-daemon assembleDebug

      # Uploaded before it is verified on purpose: if verification fails, the artifact of
      # the thing that failed is exactly what someone needs to look at.
      - uses: actions/upload-artifact@v4
        with:
          name: ClipBlitzStandalone-debug
          path: studio/android-standalone/app/build/outputs/apk/debug/app-debug.apk

      - name: Verify the APK carries CPython, the engine and the studio UI
        working-directory: studio/android-standalone
        run: python verify_apk.py app/build/outputs/apk/debug/app-debug.apk

  # Runs last, and hashes what is actually stored on the release rather than what any
  # build job produced - the source .zip is assembled by hand on the build machine, and
  # the APK is signed with a fresh key every run, so a checksums file can only be true if
  # it is regenerated after every upload. Verified with:  sha256sum -c checksums.txt
  checksums:
    name: Release checksums
    needs: [exe, apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download every published asset and write checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p assets
          gh release download v4.2.0 --repo "$GITHUB_REPOSITORY" --dir assets --clobber
          rm -f assets/checksums.txt          # never hash a previous checksums file
          cd assets && sha256sum * > ../checksums.txt && cd ..
          cat checksums.txt
          grep -q "ClipBlitzStudio-4.2.0-windows.zip" checksums.txt
          grep -q "ClipBlitzStudio.apk" checksums.txt

      - name: Upload checksums.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v4.2.0 checksums.txt --clobber -R "$GITHUB_REPOSITORY"
